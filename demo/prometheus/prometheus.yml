global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.1.10:8000"]

  - job_name: pg-exporter-p
    static_configs:
      - targets: ["10.40.1.31:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["10.40.1.40:8080"]
