# postgresql.conf — DB Scale Lab. FINAL para fases 2 y 3 (la fase 3 no lo
# toca: los parámetros de replicación ya están, sin uso hasta que existan
# réplicas).

listen_addresses     = '*'
port                 = 5432
password_encryption  = scram-sha-256

# --- Memoria: presupuesto del contenedor es POSTGRES_MEM=3g ---
shared_buffers        = 768MB   # ~25% de 3g, punto de partida estándar
effective_cache_size  = 2GB     # ~65-70% de 3g; solo informa al planner, no reserva
work_mem              = 16MB    # conservador: la mezcla es mayoritariamente PK lookups
maintenance_work_mem  = 256MB   # VACUUM / índices / el propio seed de 500k filas

# --- Conexiones: 4 workers de gunicorn x (10 escritura + 10 lectura) = 80 en
# el peor caso, + pg-exporter-p + accesos manuales de administración = 100 da
# margen sin sobredimensionar shared_buffers/work_mem por conexión. ---
max_connections = 100

# --- Replicación en streaming (fase 3), ya finales ---
wal_level                     = replica
max_wal_senders                = 10
max_replication_slots          = 10
wal_keep_size                  = 1GB
hot_standby                    = on
synchronous_commit             = on   # réplicas asincrónicas: no hace falta synchronous_standby_names

# --- WAL / checkpoints: el seed de 500k filas genera bastante WAL de una ---
max_wal_size                  = 2GB
min_wal_size                  = 512MB
checkpoint_completion_target  = 0.9

# --- Observabilidad liviana: ayuda a mostrar A2.3 en los logs del contenedor ---
log_connections    = on
log_disconnections = on
