# pg_hba.conf — DB Scale Lab. FINAL para fases 2 y 3 (la fase 3 no lo toca:
# las entradas de `replicator` ya están, sin uso hasta que existan réplicas).
# Reglas de más a menos específicas. Sin SNAT en la VIP (D7): pg_hba ve
# siempre la IP real de origen, incluso cuando el tráfico llegó vía DNAT.
#
# TYPE    DATABASE      USER         ADDRESS                METHOD

# --- Administración local: solo dentro del contenedor (socket unix). El
#     superusuario nunca tiene una entrada "host": no se expone a ninguna red.
local     all           all                                 scram-sha-256

# --- Replicación física (fase 3), desde las dos redes de réplicas ---
host      replication   replicator   10.30.1.0/24           scram-sha-256
host      replication   replicator   10.31.1.0/24           scram-sha-256

# --- Aplicación: escritura y lectura, solo desde net-app ---
host      dbscale       app_writer   10.10.1.0/24           scram-sha-256
host      dbscale       app_reader   10.10.1.0/24           scram-sha-256

# --- Monitoreo: postgres_exporter, solo desde net-mon ---
host      dbscale       monitor      10.40.1.0/24           scram-sha-256

# --- Rechazo explícito de todo lo demás (documentación: ya es el
#     comportamiento implícito de pg_hba cuando ninguna línea matchea, pero
#     se deja explícito para que A2.3 sea fácil de mostrar y explicar). ---
host      all           all          0.0.0.0/0              reject
