name: dbscale

x-net-driver-opts: &net-driver-opts
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    com.docker.network.bridge.enable_ip_masquerade: "false"

x-test-node: &test-node
  image: alpine:3.24.4
  cap_add:
    - NET_ADMIN
  profiles:
    - test-red

# Sidecar de ruteo (D5): un nodo real sin "ip" o que no corre como root (ver
# decisiones-tecnicas.md) no puede fijar su propia ruta por defecto, ni con
# NET_ADMIN. El sidecar comparte el namespace de red del nodo
# (network_mode: "service:<nodo>") y solo hace "ip route replace", como root,
# dentro de esa misma pila de red. Nunca se le da NET_ADMIN al nodo real.
x-sidecar: &sidecar
  image: alpine:3.24.4
  cap_add:
    - NET_ADMIN
  restart: unless-stopped
  cpus: "${SIDECAR_CPUS}"
  mem_limit: ${SIDECAR_MEM}

networks:
  net-clientes:
    <<: *net-driver-opts
    ipam:
      config:
        - subnet: 10.50.1.0/24
          gateway: 10.50.1.253
  net-app:
    <<: *net-driver-opts
    ipam:
      config:
        - subnet: 10.10.1.0/24
          gateway: 10.10.1.253
  net-db-primaria:
    <<: *net-driver-opts
    ipam:
      config:
        - subnet: 10.20.1.0/24
          gateway: 10.20.1.253
  net-db-local:
    <<: *net-driver-opts
    ipam:
      config:
        - subnet: 10.30.1.0/24
          gateway: 10.30.1.253
  net-db-remota:
    <<: *net-driver-opts
    ipam:
      config:
        - subnet: 10.31.1.0/24
          gateway: 10.31.1.253
  net-mon:
    <<: *net-driver-opts
    ipam:
      config:
        - subnet: 10.40.1.0/24
          gateway: 10.40.1.253

volumes:
  pg-primary-data:
  pg-replica-1-data:
  pg-replica-2-data:
  prometheus-data:
  grafana-data:

services:
  router:
    build:
      context: ./router
    image: dbscale/router:0.1.0
    container_name: dbscale-router
    hostname: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    environment:
      - FIREWALL_MODE=strict
    networks:
      net-clientes:
        ipv4_address: 10.50.1.254
      net-app:
        ipv4_address: 10.10.1.254
      net-db-primaria:
        ipv4_address: 10.20.1.254
      net-db-local:
        ipv4_address: 10.30.1.254
      net-db-remota:
        ipv4_address: 10.31.1.254
      net-mon:
        ipv4_address: 10.40.1.254
    restart: unless-stopped

  # --- Nodos de prueba (perfil test-red): verifican el ruteo y el firewall
  # con las IPs finales de los nodos reales, antes de que existan esos nodos. ---

  t-clientes:
    <<: *test-node
    container_name: dbscale-t-clientes
    hostname: t-clientes
    networks:
      net-clientes:
        ipv4_address: 10.50.1.10
    command: sh -c "ip route replace default via 10.50.1.254 && sleep infinity"

  t-app:
    <<: *test-node
    container_name: dbscale-t-app
    hostname: t-app
    networks:
      net-app:
        ipv4_address: 10.10.1.10
    command: sh -c "ip route replace default via 10.10.1.254 && while true; do nc -l -p 8000; done"

  t-db:
    <<: *test-node
    container_name: dbscale-t-db
    hostname: t-db
    networks:
      net-db-primaria:
        ipv4_address: 10.20.1.10
    command: sh -c "ip route replace default via 10.20.1.254 && while true; do nc -l -p 5432; done"

  t-replica1:
    <<: *test-node
    container_name: dbscale-t-replica1
    hostname: t-replica1
    networks:
      net-db-local:
        ipv4_address: 10.30.1.10
    command: sh -c "ip route replace default via 10.30.1.254 && while true; do nc -l -p 5432; done"

  t-replica2:
    <<: *test-node
    container_name: dbscale-t-replica2
    hostname: t-replica2
    networks:
      net-db-remota:
        ipv4_address: 10.31.1.10
    command: sh -c "ip route replace default via 10.31.1.254 && while true; do nc -l -p 5432; done"

  t-prometheus:
    <<: *test-node
    container_name: dbscale-t-prometheus
    hostname: t-prometheus
    networks:
      net-mon:
        ipv4_address: 10.40.1.20
    command: sh -c "ip route replace default via 10.40.1.254 && while true; do nc -l -p 9090; done"

  # Solo para A1.8 (publicación de puertos): no representa un nodo real del laboratorio.
  t-ui:
    <<: *test-node
    container_name: dbscale-t-ui
    hostname: t-ui
    networks:
      net-mon:
        ipv4_address: 10.40.1.99
    ports:
      - "3000:80"
    command: sh -c "ip route replace default via 10.40.1.254 && while true; do nc -l -p 80; done"

  # ======================================================================
  # Fase 2 — Base única, app y monitoreo
  # ======================================================================

  pg-primary:
    image: postgres:17.11
    container_name: dbscale-pg-primary
    hostname: pg-primary
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${PG_SUPERUSER_USER}
      - POSTGRES_PASSWORD=${PG_SUPERUSER_PASSWORD}
      - APP_WRITER_USER=${APP_WRITER_USER}
      - APP_WRITER_PASSWORD=${APP_WRITER_PASSWORD}
      - APP_READER_USER=${APP_READER_USER}
      - APP_READER_PASSWORD=${APP_READER_PASSWORD}
      - REPLICATOR_USER=${REPLICATOR_USER}
      - REPLICATOR_PASSWORD=${REPLICATOR_PASSWORD}
      - MONITOR_USER=${MONITOR_USER}
      - MONITOR_PASSWORD=${MONITOR_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pg-primary-data:/var/lib/postgresql/data
    networks:
      net-db-primaria:
        ipv4_address: 10.20.1.10
    cpus: "${POSTGRES_CPUS}"
    mem_limit: ${POSTGRES_MEM}
    restart: unless-stopped

  # Nunca NET_ADMIN en pg-primary (D5): el sidecar lo tiene en su lugar.
  sc-pg-primary:
    <<: *sidecar
    container_name: dbscale-sc-pg-primary
    network_mode: "service:pg-primary"
    depends_on:
      - pg-primary
    command: sh -c "ip route replace default via 10.20.1.254 && sleep infinity"

  # ======================================================================
  # Fase 3 — Réplicas de lectura (streaming físico asíncrono)
  # ======================================================================

  # pg-replica-1: siempre que haya al menos una réplica (perfiles r1 y r2).
  pg-replica-1:
    image: postgres:17.11
    container_name: dbscale-pg-replica-1
    hostname: pg-replica-1
    profiles:
      - r1
      - r2
    entrypoint: ["/replica-entrypoint.sh"]
    environment:
      - PRIMARY_HOST=10.20.1.10
      - PRIMARY_PORT=5432
      - REPLICATOR_USER=${REPLICATOR_USER}
      - REPLICATOR_PASSWORD=${REPLICATOR_PASSWORD}
    volumes:
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pg-replica-1-data:/var/lib/postgresql/data
    networks:
      net-db-local:
        ipv4_address: 10.30.1.10
    cpus: "${POSTGRES_CPUS}"
    mem_limit: ${POSTGRES_MEM}
    restart: unless-stopped
    depends_on:
      - pg-primary

  # Nunca NET_ADMIN en pg-replica-1 (D5): el sidecar lo tiene en su lugar.
  sc-pg-replica-1:
    <<: *sidecar
    container_name: dbscale-sc-pg-replica-1
    profiles:
      - r1
      - r2
    network_mode: "service:pg-replica-1"
    depends_on:
      - pg-replica-1
    command: sh -c "ip route replace default via 10.30.1.254 && sleep infinity"

  # pg-replica-2: solo en el escenario de dos réplicas (perfil r2).
  pg-replica-2:
    image: postgres:17.11
    container_name: dbscale-pg-replica-2
    hostname: pg-replica-2
    profiles:
      - r2
    entrypoint: ["/replica-entrypoint.sh"]
    environment:
      - PRIMARY_HOST=10.20.1.10
      - PRIMARY_PORT=5432
      - REPLICATOR_USER=${REPLICATOR_USER}
      - REPLICATOR_PASSWORD=${REPLICATOR_PASSWORD}
    volumes:
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pg-replica-2-data:/var/lib/postgresql/data
    networks:
      net-db-remota:
        ipv4_address: 10.31.1.10
    cpus: "${POSTGRES_CPUS}"
    mem_limit: ${POSTGRES_MEM}
    restart: unless-stopped
    depends_on:
      - pg-primary

  sc-pg-replica-2:
    <<: *sidecar
    container_name: dbscale-sc-pg-replica-2
    profiles:
      - r2
    network_mode: "service:pg-replica-2"
    depends_on:
      - pg-replica-2
    command: sh -c "ip route replace default via 10.31.1.254 && sleep infinity"

  api:
    build:
      context: ../app
    image: dbscale/api:0.1.0
    container_name: dbscale-api
    hostname: api
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - WRITER_DB_HOST=${WRITER_DB_HOST}
      - WRITER_DB_PORT=${WRITER_DB_PORT}
      - WRITER_POOL_MIN=${WRITER_POOL_MIN}
      - WRITER_POOL_MAX=${WRITER_POOL_MAX}
      - APP_WRITER_USER=${APP_WRITER_USER}
      - APP_WRITER_PASSWORD=${APP_WRITER_PASSWORD}
      - READ_DB_HOSTS=${READ_DB_HOSTS}
      - READER_DB_PORT=${READER_DB_PORT}
      - READER_POOL_MIN=${READER_POOL_MIN}
      - READER_POOL_MAX=${READER_POOL_MAX}
      - APP_READER_USER=${APP_READER_USER}
      - APP_READER_PASSWORD=${APP_READER_PASSWORD}
      - READ_FALLBACK_TO_PRIMARY=${READ_FALLBACK_TO_PRIMARY}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS}
      - READER_RECHECK_INTERVAL_SECONDS=${READER_RECHECK_INTERVAL_SECONDS}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS}
      - DB_GET_TIMEOUT_SECONDS=${DB_GET_TIMEOUT_SECONDS}
    networks:
      net-app:
        ipv4_address: 10.10.1.10
    cpus: "${API_CPUS}"
    mem_limit: ${API_MEM}
    restart: unless-stopped
    depends_on:
      - pg-primary

  sc-api:
    <<: *sidecar
    container_name: dbscale-sc-api
    network_mode: "service:api"
    depends_on:
      - api
    command: sh -c "ip route replace default via 10.10.1.254 && sleep infinity"

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: dbscale-prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      net-mon:
        ipv4_address: 10.40.1.20
    ports:
      - "9091:9090"
    cpus: "${PROMETHEUS_CPUS}"
    mem_limit: ${PROMETHEUS_MEM}
    restart: unless-stopped

  sc-prometheus:
    <<: *sidecar
    container_name: dbscale-sc-prometheus
    network_mode: "service:prometheus"
    depends_on:
      - prometheus
    command: sh -c "ip route replace default via 10.40.1.254 && sleep infinity"

  # Grafana solo habla con prometheus dentro de net-mon (mismo segmento, sin
  # pasar por el router): no necesita ruta por defecto ni sidecar (D5).
  grafana:
    image: grafana/grafana:13.3.0
    container_name: dbscale-grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      net-mon:
        ipv4_address: 10.40.1.21
    ports:
      - "3000:3000"
    cpus: "${GRAFANA_CPUS}"
    mem_limit: ${GRAFANA_MEM}
    restart: unless-stopped
    depends_on:
      - prometheus

  pg-exporter-p:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: dbscale-pg-exporter-p
    hostname: pg-exporter-p
    environment:
      - DATA_SOURCE_NAME=postgresql://${MONITOR_USER}:${MONITOR_PASSWORD}@10.20.1.10:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      net-mon:
        ipv4_address: 10.40.1.31
    cpus: "${EXPORTER_CPUS}"
    mem_limit: ${EXPORTER_MEM}
    restart: unless-stopped
    depends_on:
      - pg-primary

  sc-pg-exporter-p:
    <<: *sidecar
    container_name: dbscale-sc-pg-exporter-p
    network_mode: "service:pg-exporter-p"
    depends_on:
      - pg-exporter-p
    command: sh -c "ip route replace default via 10.40.1.254 && sleep infinity"

  # pg-exporter-1/2: exportan métricas de cada réplica (mismo patrón que
  # pg-exporter-p). Comparten perfil con su réplica correspondiente, así no
  # quedan corriendo sin nada que scrapear.
  pg-exporter-1:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: dbscale-pg-exporter-1
    hostname: pg-exporter-1
    profiles:
      - r1
      - r2
    environment:
      - DATA_SOURCE_NAME=postgresql://${MONITOR_USER}:${MONITOR_PASSWORD}@10.30.1.10:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      net-mon:
        ipv4_address: 10.40.1.32
    cpus: "${EXPORTER_CPUS}"
    mem_limit: ${EXPORTER_MEM}
    restart: unless-stopped
    depends_on:
      - pg-replica-1

  sc-pg-exporter-1:
    <<: *sidecar
    container_name: dbscale-sc-pg-exporter-1
    profiles:
      - r1
      - r2
    network_mode: "service:pg-exporter-1"
    depends_on:
      - pg-exporter-1
    command: sh -c "ip route replace default via 10.40.1.254 && sleep infinity"

  pg-exporter-2:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: dbscale-pg-exporter-2
    hostname: pg-exporter-2
    profiles:
      - r2
    environment:
      - DATA_SOURCE_NAME=postgresql://${MONITOR_USER}:${MONITOR_PASSWORD}@10.31.1.10:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      net-mon:
        ipv4_address: 10.40.1.33
    cpus: "${EXPORTER_CPUS}"
    mem_limit: ${EXPORTER_MEM}
    restart: unless-stopped
    depends_on:
      - pg-replica-2

  sc-pg-exporter-2:
    <<: *sidecar
    container_name: dbscale-sc-pg-exporter-2
    profiles:
      - r2
    network_mode: "service:pg-exporter-2"
    depends_on:
      - pg-exporter-2
    command: sh -c "ip route replace default via 10.40.1.254 && sleep infinity"

  # cAdvisor solo habla con prometheus dentro de net-mon: no necesita ruta
  # por defecto ni sidecar (D5). Corre como root (confirmado) y no inicia
  # tráfico cruzado de subred en esta fase.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: dbscale-cadvisor
    hostname: cadvisor
    command:
      - "-docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      net-mon:
        ipv4_address: 10.40.1.40
    cpus: "${CADVISOR_CPUS}"
    mem_limit: ${CADVISOR_MEM}
    restart: unless-stopped
    # privileged: true  # activar y justificar acá y en decisiones-tecnicas.md
    # si los mounts de solo lectura no alcanzan para leer cgroups/overlayfs.

  # --- k6 (perfil "carga"): el servicio queda definido ya en fase 2 porque
  # A2.5 necesita una prueba corta real; el conjunto de escenarios de k6
  # (demo/k6/*.js) es entregable de la fase 3. Se mantiene arriba con
  # "sleep infinity" (igual que los nodos de prueba de fase 1) y las corridas
  # van por "docker compose exec -T k6 k6 run ...", nunca por "run" (que
  # crearía un contenedor nuevo sin el sidecar ya aplicado). ---
  k6:
    image: grafana/k6:2.3.0
    container_name: dbscale-k6
    hostname: k6
    profiles:
      - carga
    entrypoint: ["sleep", "infinity"]
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://10.40.1.20:9090/api/v1/write
      - API_BASE_URL=http://10.10.1.10:8000
    volumes:
      - ./k6:/scripts:ro
    networks:
      net-clientes:
        ipv4_address: 10.50.1.10
    cpus: "${K6_CPUS}"
    mem_limit: ${K6_MEM}
    restart: unless-stopped

  sc-k6:
    <<: *sidecar
    container_name: dbscale-sc-k6
    profiles:
      - carga
    network_mode: "service:k6"
    depends_on:
      - k6
    command: sh -c "ip route replace default via 10.50.1.254 && sleep infinity"
