# Inventario de un solo host: el controlador es la misma máquina donde corre
# el laboratorio (conexión local, sin SSH). El grupo se llama "controlador"
# porque los 3 playbooks usan "hosts: controlador" en su cabecera.
all:
  children:
    controlador:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
